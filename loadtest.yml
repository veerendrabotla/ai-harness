# PHASE 13 #13 — multi-instance local load test.
#
# Run against a scaled API tier (see docker-compose.load.yml):
#   docker compose -f docker-compose.yml -f docker-compose.load.yml up -d --scale api=2
#   # seed the fixed login account (idempotent; 409 just means it already exists)
#   curl -X POST http://localhost:4000/v1/auth/signup -H "Content-Type: application/json" -d "{\"email\":\"loadtest-lead@example.com\",\"password\":\"TestPassword123!\",\"displayName\":\"Load Test Lead\"}"
#   npm run loadtest
#
# Traffic is split deterministically 50/50 across both replicas via absolute
# URLs (instance 1 = host 4000, instance 2 = host 4001), so the report measures
# the two-instance tier rather than whatever Docker's port proxy picks.
# Error budget: `ensure` below — artillery exits non-zero when violated.
config:
  target: "http://localhost:4000"
  phases:
    - duration: 60
      arrivalRate: 10
      name: "Warm up"
    - duration: 120
      arrivalRate: 50
      name: "Load test"
    - duration: 60
      arrivalRate: 75
      name: "Spike test"
  defaults:
    headers:
      Content-Type: "application/json"
  # Error budget (local Docker tier SLO): derived from the measured steady
  # state at 50 rps (server p99 637ms, client p99 ~1.1s) — p99 <= 1.5s leaves
  # headroom for argon2 bursts; 1% max error rate tolerates no timeouts/5xx
  # at sub-capacity rates. Artillery exits non-zero when violated.
  ensure:
    p99: 1500
    maxErrorRate: 1
  processor: "./loadtest-processor.js"

scenarios:
  # --- health (rate-limit exempt; liveness of each replica) ---
  - name: "health instance-1"
    weight: 20
    flow:
      - get:
          url: "http://localhost:4000/healthz"
          expect:
            - statusCode: 200

  - name: "health instance-2"
    weight: 20
    flow:
      - get:
          url: "http://localhost:4001/healthz"
          expect:
            - statusCode: 200

  # --- signup + authenticated read (argon2 hash + DB writes + Bearer path) ---
  - name: "signup + tasks instance-1"
    weight: 15
    flow:
      - function: "setUniqueEmail"
      - post:
          url: "http://localhost:4000/v1/auth/signup"
          json:
            email: "{{ signupEmail }}"
            password: "TestPassword123!"
            displayName: "Load Test User"
          expect:
            - statusCode: 201
          capture:
            - json: "$.data.accessToken"
              as: "token"
      - get:
          url: "http://localhost:4000/v1/tasks"
          headers:
            Authorization: "Bearer {{ token }}"
          expect:
            - statusCode: 200

  - name: "signup + tasks instance-2"
    weight: 15
    flow:
      - function: "setUniqueEmail"
      - post:
          url: "http://localhost:4001/v1/auth/signup"
          json:
            email: "{{ signupEmail }}"
            password: "TestPassword123!"
            displayName: "Load Test User"
          expect:
            - statusCode: 201
          capture:
            - json: "$.data.accessToken"
              as: "token"
      - get:
          url: "http://localhost:4001/v1/tasks"
          headers:
            Authorization: "Bearer {{ token }}"
          expect:
            - statusCode: 200

  # --- login of the seeded lead account (argon2 verify against shared DB) ---
  - name: "login instance-1"
    weight: 10
    flow:
      - post:
          url: "http://localhost:4000/v1/auth/login"
          json:
            email: "loadtest-lead@example.com"
            password: "TestPassword123!"
          expect:
            - statusCode: 200

  - name: "login instance-2"
    weight: 10
    flow:
      - post:
          url: "http://localhost:4001/v1/auth/login"
          json:
            email: "loadtest-lead@example.com"
            password: "TestPassword123!"
          expect:
            - statusCode: 200

  # --- unauthorized reads (401 path; no limiter trip expected) ---
  - name: "unauthorized instance-1"
    weight: 5
    flow:
      - get:
          url: "http://localhost:4000/v1/tasks"
          expect:
            - statusCode: 401

  - name: "unauthorized instance-2"
    weight: 5
    flow:
      - get:
          url: "http://localhost:4001/v1/tasks"
          expect:
            - statusCode: 401
