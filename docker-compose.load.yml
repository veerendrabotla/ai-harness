# Load-test override for PHASE 13 task #13 (multi-instance local load test).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.load.yml up -d --scale api=2
#   npm run loadtest
#   docker compose -f docker-compose.yml -f docker-compose.load.yml up -d --scale api=1  # restore single instance
#
# - `container_name` is reset because a fixed name conflicts with --scale.
#   Service DNS ("api") is unaffected — gateway/frontend already use it.
# - Host ports 4000-4001 are published across the scaled instances so the
#   host-side load generator can split traffic deterministically.
# - Rate-limit ceilings are raised: they are an infrastructure control, not
#   the system under test. The Redis-backed limiter stays active (it must
#   still behave with two replicas sharing one Redis).
services:
  api:
    container_name: !reset null
    ports: !override
      - "4000-4001:4000"
    environment:
      RATE_LIMIT_SIGNUP_PER_HOUR: "100000"
      RATE_LIMIT_LOGIN_PER_15MIN: "100000"
      RATE_LIMIT_RESET_PER_HOUR: "100000"
      RATE_LIMIT_GLOBAL_MAX: "100000"
