# Production quickstart stack — pulls prebuilt images from GHCR, no clone or
# build required. Used by install.sh / install.ps1 and verified by the
# publish-images workflow (quickstart job) on every push to main.
#
#   AI_H_INSTALL_DIR contains docker-compose.release.yml + .env (install scripts
#   generate both). Host ports are overridable via AI_H_PORT_* env vars.
name: ai-harness

services:
  postgres:
    image: postgres:17.4
    container_name: ${AI_H_PREFIX:-ai-harness}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_harness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_harness}
      POSTGRES_DB: ${POSTGRES_DB:-ai_harness}
    ports:
      - "${AI_H_PORT_PG:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_harness -d ai_harness"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4
    container_name: ${AI_H_PREFIX:-ai-harness}-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-ai_harness_redis}"]
    ports:
      - "${AI_H_PORT_REDIS:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "ai_harness_redis", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: ghcr.io/veerendrabotla/ai-harness-api:latest
    container_name: ${AI_H_PREFIX:-ai-harness}-migrate
    restart: "no"
    command: ["node", "scripts/migrate.mjs"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_harness}:${POSTGRES_PASSWORD:-ai_harness}@postgres:5432/${POSTGRES_DB:-ai_harness}?connection_limit=5&pool_timeout=10
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ghcr.io/veerendrabotla/ai-harness-api:latest
    container_name: ${AI_H_PREFIX:-ai-harness}-api
    restart: unless-stopped
    ports:
      - "${AI_H_PORT_API:-4000}:4000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_harness}:${POSTGRES_PASSWORD:-ai_harness}@postgres:5432/${POSTGRES_DB:-ai_harness}?connection_limit=10&pool_timeout=10
      REDIS_URL: redis://:${REDIS_PASSWORD:-ai_harness_redis}@redis:6379
      NODE_ENV: production
      SANDBOX_MODE: ${SANDBOX_MODE:-docker}
      BRIDGE_GATEWAY_URL: http://gateway:4010
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    image: ghcr.io/veerendrabotla/ai-harness-worker:latest
    container_name: ${AI_H_PREFIX:-ai-harness}-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_harness}:${POSTGRES_PASSWORD:-ai_harness}@postgres:5432/${POSTGRES_DB:-ai_harness}?connection_limit=10&pool_timeout=10
      REDIS_URL: redis://:${REDIS_PASSWORD:-ai_harness_redis}@redis:6379
      NODE_ENV: production
      SANDBOX_MODE: ${SANDBOX_MODE:-docker}
      BRIDGE_GATEWAY_URL: http://gateway:4010
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  gateway:
    image: ghcr.io/veerendrabotla/ai-harness-gateway:latest
    container_name: ${AI_H_PREFIX:-ai-harness}-gateway
    restart: unless-stopped
    ports:
      - "${AI_H_PORT_GW:-4010}:4010"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_harness}:${POSTGRES_PASSWORD:-ai_harness}@postgres:5432/${POSTGRES_DB:-ai_harness}?connection_limit=5&pool_timeout=10
      REDIS_URL: redis://:${REDIS_PASSWORD:-ai_harness_redis}@redis:6379
      API_URL: http://api:4000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  frontend:
    image: ghcr.io/veerendrabotla/ai-harness-frontend:latest
    container_name: ${AI_H_PREFIX:-ai-harness}-frontend
    restart: unless-stopped
    ports:
      - "${AI_H_PORT_WEB:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      api:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redis-data:
