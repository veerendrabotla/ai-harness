name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  TURBO_CACHE: ".turbo"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript type check
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    services:
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_USER: ai_harness
          POSTGRES_PASSWORD: ai_harness
          POSTGRES_DB: ai_harness
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ai_harness"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://ai_harness:ai_harness@localhost:5432/ai_harness?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-32+
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3OGFiY2RlZjA=
      BRIDGE_INTERNAL_TOKEN: ci-bridge-token-ci-bridge-token-ci+
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prisma generate + migrate
        run: npx prisma migrate deploy --schema backend/prisma/schema.prisma
      - name: Unit tests
        run: npx vitest run --exclude '**/races.integration.test.ts' --exclude '**/session-portability.integration.test.ts'
      - name: Integration tests
        run: npx vitest run backend/apps/api/tests/acceptance.integration.test.ts backend/apps/api/tests/multiplayer.integration.test.ts
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: npm run build -w frontend
      - name: Build backend
        run: npm run build:backend

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev || true
