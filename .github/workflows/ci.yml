name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  TURBO_CACHE: ".turbo"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript type check
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    services:
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_USER: ai_harness
          POSTGRES_PASSWORD: ai_harness
          POSTGRES_DB: ai_harness
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ai_harness"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://ai_harness:ai_harness@localhost:5432/ai_harness?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-32+
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3OGFiY2RlZjA=
      BRIDGE_INTERNAL_TOKEN: ci-bridge-token-ci-bridge-token-ci+
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prisma generate + migrate
        run: npx prisma migrate deploy --schema backend/prisma/schema.prisma
      - name: Unit tests
        run: npx vitest run --exclude '**/races.integration.test.ts' --exclude '**/session-portability.integration.test.ts'
      - name: Integration tests
        run: npx vitest run backend/apps/api/tests/acceptance.integration.test.ts backend/apps/api/tests/multiplayer.integration.test.ts
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: npm run build -w frontend
      - name: Build backend
        run: npm run build:backend

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev || true

  docker:
    name: Docker compose boot health
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Docker manifests in sync
        run: node scripts/gen-docker-manifests.mjs --check
      - name: Create .env
        run: node scripts/setup-env.mjs
      - name: Build images
        run: docker compose build
      - name: Boot stack
        run: docker compose up -d
      - name: Wait for API + frontend health
        run: |
          set -euo pipefail
          api_ok=""
          web_ok=""
          for i in $(seq 1 60); do
            if [ -z "$api_ok" ]; then
              body="$(curl -fsS http://localhost:4000/healthz || true)"
              case "$body" in
                *'"status":"ok"'*'"database":"up"'*) api_ok=1 ;;
              esac
            fi
            if [ -z "$web_ok" ]; then
              code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000 || true)"
              if [ "$code" = "200" ]; then web_ok=1; fi
            fi
            if [ -n "$api_ok" ] && [ -n "$web_ok" ]; then
              echo "stack healthy after ${i} poll(s)"
              exit 0
            fi
            sleep 5
          done
          echo "TIMEOUT waiting for stack health"
          docker compose ps
          docker compose logs --tail 100 api frontend migrate
          exit 1
      - name: Migrate exited 0
        run: |
          set -euo pipefail
          cid="$(docker compose ps -aq migrate)"
          code="$(docker inspect --format '{{.State.ExitCode}}' "$cid")"
          echo "migrate exit=$code"
          [ "$code" = "0" ]
      - name: Teardown
        if: always()
        run: docker compose down -v

  terraform:
    name: Terraform fmt/validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false
      - name: terraform validate
        run: terraform validate
